spring:
  application:
    name: master-service
  profiles:
    default: prom

server:
  port: 8443

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

master:
  nodeId: master-node-01
  balancer:
    baseUrl: https://balancer:8443
  cache:
    limits:
      classA:
        maxEntries: 50000
        maxMemoryMb: 512
      classB:
        maxEntries: 100000
        maxMemoryMb: 1024
      classC:
        maxEntries: 200000
        maxMemoryMb: 2048
