spring:
  application:
    name: balancer-service

server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:tls/keystore.p12
    key-store-password: ${TLS_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    trust-store: classpath:tls/truststore.p12
    trust-store-password: ${TLS_TRUSTSTORE_PASSWORD:changeit}
    trust-store-type: PKCS12

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

router:
  slot-count: 16384
  distribution-strategy: weighted
  rebalance:
    enabled: true
    threshold-percent: 15
    cooldown-seconds: 30

heartbeat:
  timeout-millis: 5000
  check-interval-millis: 2000

tls:
  cert-service:
    base-url: ${CERT_SERVICE_URL:https://cert-service:8443}
    refresh-interval-seconds: 3600

master-client:
  connect-timeout-millis: 2000
  read-timeout-millis: 5000
  retry:
    max-attempts: 3
    delay-millis: 500
