spring:
  application:
    name: balancer-service-test
  main:
    allow-bean-definition-overriding: true

server:
  port: 0
  ssl:
    enabled: false

router:
  slot-count: 64
  distribution-strategy: weighted
  rebalance:
    enabled: true
    threshold-percent: 15
    cooldown-seconds: 0

heartbeat:
  timeout-millis: 2000
  check-interval-millis: 999999

tls:
  cert-service:
    base-url: https://localhost:19999
    refresh-interval-seconds: 999999

master-client:
  connect-timeout-millis: 1000
  read-timeout-millis: 2000
  retry:
    max-attempts: 1
    delay-millis: 100
